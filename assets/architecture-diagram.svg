      <rect width="207" height="95" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" class="font-title-node">⚡ Delta-BGR Move Detector</text>
      <text x="12" y="42" class="font-desc-node">256-Square Vectorized Diff</text>
      <text x="12" y="58" class="font-desc-node">Euclidean Distance Matrix</text>
      <rect x="12" y="68" width="110" height="18" rx="4" fill="#06b6d4" fill-opacity="0.2" />
      <text x="18" y="81" class="font-tag" fill="#22d3ee">0.43 ms (2290 FPS)</text>
    </g>

    <!-- Node 2.3: Dual Input Router & FSM -->
    <g transform="translate(14, 290)">
      <rect width="207" height="105" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" class="font-title-node">🔀 Input Router &amp; python-chess</text>
      <text x="12" y="42" class="font-desc-node">Instant Hot-Swap Failover</text>
      <text x="12" y="58" class="font-desc-node">Legal Move Rule Enforcement</text>
      <rect x="12" y="74" width="105" height="18" rx="4" fill="#06b6d4" fill-opacity="0.2" />
      <text x="18" y="87" class="font-tag" fill="#22d3ee">Zero-Drop State</text>
