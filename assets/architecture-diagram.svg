      <rect width="207" height="75" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" class="font-title-node">📖 Polyglot Opening (.bin)</text>
      <text x="12" y="40" class="font-desc-node">Standard Grandmaster Lines</text>
      <rect x="12" y="48" width="95" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="18" y="61" class="font-tag" fill="#d8b4fe">0.05 ms Look-Up</text>
    </g>

    <!-- Node 3.2: Stockfish 19 NNUE -->
    <g transform="translate(14, 145)">
      <rect width="207" height="85" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
