      <text x="12" y="40" class="font-desc-node">Multi-PV, Hash LRU Cache</text>
      <rect x="12" y="55" width="115" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="18" y="68" class="font-tag" fill="#d8b4fe">God Mode (3600+)</text>
    </g>

    <!-- Node 3.3: Maia Chess Neural Net -->
    <g transform="translate(14, 240)">
      <rect width="207" height="85" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" class="font-title-node">🧠 Maia Chess (ONNX)</text>
      <text x="12" y="40" class="font-desc-node">Human Elo 1100, 1500, 1900</text>
      <rect x="12" y="55" width="110" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="18" y="68" class="font-tag" fill="#d8b4fe">Human Psychology</text>
    </g>

    <!-- Node 3.4: Concept Coach -->
    <g transform="translate(14, 335)">
      <rect width="207" height="65" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="20" class="font-title-node">🎓 Pedagogical Coach</text>
      <text x="12" y="38" class="font-desc-node">Pins, Forks, Skewers &amp; Motifs</text>
      <text x="12" y="52" class="font-tag" fill="#c084fc">&lt; 0.5 ms Tactical Eval</text>
    </g>
  </g>

  <!-- Connectors Col 3 -> Col 4 -->
  <path d="M 810 215 L 845 215" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)" />
  <path d="M 810 330 L 845 330" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)" />

  <!-- Column 4: Execution & Actuation -->
  <g transform="translate(845, 75)">
    <!-- Column Frame -->
    <rect width="220" height="415" rx="12" fill="url(#execCard)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="16" y="28" class="font-col" fill="#34d399">4. EXECUTION &amp; ACTUATION</text>
    <text x="16" y="44" class="font-sub">Visual, Audio &amp; Physical</text>

    <!-- Node 4.1: AR Video & Click-Through HUD -->
    <g transform="translate(12, 60)">
      <rect width="196" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="10" y="22" class="font-title-node">🔮 AR HUD &amp; Transparent GUI</text>
      <text x="10" y="40" class="font-desc-node">Neon Arrow ROI Blending</text>
      <text x="10" y="54" class="font-desc-node">PyQt6 Click-Through</text>
      <rect x="10" y="60" width="100" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="15" y="73" class="font-tag" fill="#34d399">270 FPS Overlay</text>
    </g>

    <!-- Node 4.2: Audio Feedback -->
    <g transform="translate(12, 155)">
      <rect width="196" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="10" y="22" class="font-title-node">🔊 Voice &amp; Stealth Earcon</text>
      <text x="10" y="40" class="font-desc-node">Edge Neural TTS (Farsi)</text>
      <text x="10" y="54" class="font-desc-node">Pure PCM Stealth Clicks</text>
      <rect x="10" y="60" width="95" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="15" y="73" class="font-tag" fill="#34d399">0.08 ms Cache</text>
    </g>

    <!-- Node 4.3: WindMouse Biomechanical -->
    <g transform="translate(12, 250)">
      <rect width="196" height="145" rx="8" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="10" y="22" class="font-title-node">🖱️ Biomechanical WindMouse</text>
      <text x="10" y="40" class="font-desc-node">Flash &amp; Hogan Min-Jerk</text>
      <text x="10" y="54" class="font-desc-node">Overshoot &amp; Hand Tremors</text>
      <text x="10" y="68" class="font-desc-node">Log-Normal Thinking Time</text>
      <text x="10" y="82" class="font-desc-node">macOS CoreGraphics / Win32</text>
      <rect x="10" y="94" width="110" height="20" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="15" y="108" class="font-tag" fill="#34d399">Anti-Cheat Evasion</text>
      <rect x="10" y="118" width="90" height="18" rx="4" fill="#10b981" fill-opacity="0.1" />
      <text x="15" y="131" class="font-tag" fill="#6ee7b7">Curvature R≈0.95</text>
    </g>
  </g>
</svg>
