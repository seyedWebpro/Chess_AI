<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Layer Gradients -->
    <linearGradient id="inputCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="perceptCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="brainCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="execCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" />
    </marker>
  </defs>

  <style>
    .font-h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 20px; fill: #f8fafc; }
    .font-col { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .font-title-node { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
    .font-desc-node { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; fill: #cbd5e1; }
    .font-tag { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1100" height="520" rx="16" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title Header -->
  <g transform="translate(35, 30)">
    <circle cx="10" cy="10" r="4" fill="#38bdf8" />
    <text x="24" y="16" class="font-h1">SYSTEM ARCHITECTURE &amp; DATA PIPELINE</text>
    <text x="440" y="15" class="font-sub">High-Throughput Multi-Modal Processing from Pixels to Kinematic Actuation</text>
  </g>

  <!-- Column 1: Multi-Modal Inputs -->
  <g transform="translate(35, 75)">
    <!-- Column Frame -->
    <rect width="235" height="415" rx="12" fill="url(#inputCard)" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1" />
    <text x="16" y="28" class="font-col" fill="#38bdf8">1. MULTI-MODAL INPUTS</text>
    <text x="16" y="44" class="font-sub">Parallel Ingestion Feeds</text>

    <!-- Node 1.1: Physical Webcam -->
    <g transform="translate(14, 60)">
      <rect width="207" height="95" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" class="font-title-node">📷 Physical Board (Webcam)</text>
      <text x="12" y="42" class="font-desc-node">1280x720 HD Video Stream</text>
      <text x="12" y="58" class="font-desc-node">ArUco 4-Corner Calibration</text>
      <rect x="12" y="68" width="90" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" />
      <text x="18" y="81" class="font-tag" fill="#38bdf8">2.5 ms | 390 FPS</text>
    </g>

    <!-- Node 1.2: Digital Screen Capture -->
    <g transform="translate(14, 175)">
      <rect width="207" height="95" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" class="font-title-node">🖥️ Digital Monitor (mss)</text>
      <text x="12" y="42" class="font-desc-node">Desktop Shared-Mem Buffer</text>
      <text x="12" y="58" class="font-desc-node">Auto Contour Symmetry Finder</text>
      <rect x="12" y="68" width="90" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" />
      <text x="18" y="81" class="font-tag" fill="#38bdf8">&lt; 2 ms Latency</text>
    </g>

    <!-- Node 1.3: DOM WebExtension Bridge -->
    <g transform="translate(14, 290)">
      <rect width="207" height="105" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" class="font-title-node">🌐 Chrome MV3 / Tampermonkey</text>
      <text x="12" y="42" class="font-desc-node">DOM Mutation Observer</text>
      <text x="12" y="58" class="font-desc-node">Local WebSocket (Port 8765)</text>
      <rect x="12" y="74" width="105" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" />
      <text x="18" y="87" class="font-tag" fill="#38bdf8">Zero-Config Sync</text>
    </g>
  </g>

  <!-- Connectors Col 1 -> Col 2 -->
  <path d="M 270 182 L 305 182" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowCyan)" />
  <path d="M 270 297 L 305 297" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowCyan)" />
  <path d="M 270 412 L 305 412" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowCyan)" />

  <!-- Column 2: Perception & Validation -->
  <g transform="translate(305, 75)">
    <!-- Column Frame -->
    <rect width="235" height="415" rx="12" fill="url(#perceptCard)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
    <text x="16" y="28" class="font-col" fill="#06b6d4">2. PERCEPTION &amp; ROUTING</text>
    <text x="16" y="44" class="font-sub">Noise Filtering &amp; FSM State</text>

    <!-- Node 2.1: Physical CV Pipeline -->
    <g transform="translate(14, 60)">
      <rect width="207" height="95" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" class="font-title-node">🔍 Anti-Shadow Vision Filter</text>
      <text x="12" y="42" class="font-desc-node">SSIM + LAB Color Contrast</text>
      <text x="12" y="58" class="font-desc-node">MediaPipe Hand Occlusion Lock</text>
      <rect x="12" y="68" width="90" height="18" rx="4" fill="#06b6d4" fill-opacity="0.2" />
      <text x="18" y="81" class="font-tag" fill="#22d3ee">5.8 ms Frame</text>
