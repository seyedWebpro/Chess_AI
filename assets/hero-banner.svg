<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="45%" stop-color="#0b1120" />
      <stop offset="80%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#818cf8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; letter-spacing: -1.5px; }
    .font-mono { font-family: "SF Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Base Card -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#cyanGlow)" />
  <rect width="1200" height="420" rx="20" fill="url(#purpleGlow)" />
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />
  <rect width="1200" height="420" rx="20" fill="url(#dots)" opacity="0.6" />

  <!-- Outer Border Glow -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Decorative Isometric Chess Board Grid (Bottom-Right Perspective) -->
  <g opacity="0.18" transform="translate(680, 190) scale(1.1, 0.45) rotate(-35)">
    <!-- 8x8 stylized squares -->
    <g fill="#38bdf8" stroke="#38bdf8" stroke-width="1">
      <rect x="0" y="0" width="50" height="50" fill-opacity="0.5" />
      <rect x="100" y="0" width="50" height="50" fill-opacity="0.5" />
      <rect x="200" y="0" width="50" height="50" fill-opacity="0.5" />
      <rect x="300" y="0" width="50" height="50" fill-opacity="0.5" />
      <rect x="50" y="50" width="50" height="50" fill-opacity="0.5" />
      <rect x="150" y="50" width="50" height="50" fill-opacity="0.5" />
      <rect x="250" y="50" width="50" height="50" fill-opacity="0.5" />
      <rect x="350" y="50" width="50" height="50" fill-opacity="0.5" />
      <rect x="0" y="100" width="50" height="50" fill-opacity="0.5" />
      <rect x="100" y="100" width="50" height="50" fill-opacity="0.5" />
      <rect x="200" y="100" width="50" height="50" fill-opacity="0.5" />
      <rect x="300" y="100" width="50" height="50" fill-opacity="0.5" />
      <rect x="50" y="150" width="50" height="50" fill-opacity="0.5" />
      <rect x="150" y="150" width="50" height="50" fill-opacity="0.5" />
      <rect x="250" y="150" width="50" height="50" fill-opacity="0.5" />
      <rect x="350" y="150" width="50" height="50" fill-opacity="0.5" />
      <rect x="0" y="200" width="50" height="50" fill-opacity="0.5" />
      <rect x="100" y="200" width="50" height="50" fill-opacity="0.5" />
      <rect x="200" y="200" width="50" height="50" fill-opacity="0.5" />
      <rect x="300" y="200" width="50" height="50" fill-opacity="0.5" />
    </g>
  </g>

  <!-- Left Neon Chess Knight Emblem -->
  <g transform="translate(68, 65)">
    <!-- Outer Glow Aura -->
    <circle cx="90" cy="140" r="110" fill="#06b6d4" opacity="0.12" filter="url(#softGlow)" />
    
    <!-- Cybernetic Knight Silhouette Vector -->
    <path d="M 50 250 L 130 250 C 135 250 140 245 140 240 L 140 230 C 140 220 132 212 125 208 L 122 205 C 135 190 142 170 142 145 C 142 120 135 102 126 90 C 122 85 120 78 122 72 L 126 55 C 127 50 123 45 118 45 C 114 45 110 48 108 52 L 102 65 C 98 72 90 75 82 72 L 68 67 C 62 65 56 68 54 74 L 50 86 C 48 92 42 96 35 96 L 22 96 C 16 96 11 101 12 107 C 15 125 24 140 40 152 L 48 158 C 45 175 42 200 40 230 C 39 240 43 250 50 250 Z" 
          fill="none" stroke="url(#accentCyan)" stroke-width="3" filter="url(#glowFilter)" />
    
    <path d="M 60 250 L 120 250 M 65 240 L 115 240 M 70 230 L 110 230" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Neon Eye -->
    <circle cx="58" cy="115" r="5" fill="#38bdf8" filter="url(#glowFilter)" />
    <circle cx="58" cy="115" r="2" fill="#ffffff" />

    <!-- Circuit Accents on Knight -->
    <path d="M 58 120 L 58 145 L 85 165 L 85 205" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
    <circle cx="85" cy="205" r="3" fill="#c084fc" />
    <path d="M 85 165 L 110 150" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <circle cx="110" cy="150" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Right Floating Cyber King / Crown Emblem -->
  <g transform="translate(980, 80)">
    <circle cx="90" cy="120" r="100" fill="#8b5cf6" opacity="0.15" filter="url(#softGlow)" />
    <!-- Crown / King Cross -->
    <path d="M 90 35 L 90 65 M 75 48 L 105 48" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" filter="url(#glowFilter)" />
    <path d="M 45 190 L 135 190 L 145 110 L 115 130 L 90 80 L 65 130 L 35 110 Z" 
          fill="none" stroke="url(#titleGrad)" stroke-width="3" stroke-linejoin="round" filter="url(#glowFilter)" />
    <!-- Glowing Gemstones -->
    <circle cx="90" cy="80" r="4" fill="#f472b6" filter="url(#glowFilter)" />
    <circle cx="35" cy="110" r="3.5" fill="#38bdf8" filter="url(#glowFilter)" />
    <circle cx="145" cy="110" r="3.5" fill="#a855f7" filter="url(#glowFilter)" />
    <!-- Base Plate -->
    <rect x="40" y="196" width="100" height="8" rx="4" fill="#818cf8" opacity="0.4" />
  </g>

  <!-- Main Content Center -->
  <g transform="translate(260, 60)">
    <!-- Top Pill: Status & Architecture -->
    <g transform="translate(0, 10)">
      <rect width="365" height="28" rx="14" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="16" cy="14" r="4.5" fill="#22c55e" filter="url(#glowFilter)" />
      <text x="28" y="18" fill="#e0f2fe" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="0.5">
        PRODUCTION-GRADE MULTI-MODAL CHESS AI
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="98" fill="url(#titleGrad)" class="font-title" font-size="64" font-weight="900" filter="url(#glowFilter)">
      CHESS AI
    </text>

    <!-- Subtitle -->
    <text x="2" y="134" fill="#f1f5f9" class="font-sans" font-size="18" font-weight="600" letter-spacing="-0.3">
      Autonomous Computer Vision • Biomechanical Kinematics • Hybrid Brain
    </text>

    <!-- Description -->
    <text x="2" y="162" fill="#94a3b8" class="font-sans" font-size="13.5" font-weight="400">
      Engineered for live physical boards (Webcam + ArUco) and digital screen play (Chess.com &amp; Lichess).
    </text>
    <text x="2" y="182" fill="#94a3b8" class="font-sans" font-size="13.5" font-weight="400">
      Powered by Stockfish 19 NNUE (3600+ Elo), Maia Human Neural Net, and Anti-Cheat Evasion.
    </text>

    <!-- Tech Feature Pills (Grid 2 rows x 3 columns) -->
    <g transform="translate(0, 212)">
      <!-- Pill 1: Stockfish 19 -->
      <g transform="translate(0, 0)">
        <rect width="215" height="34" rx="8" fill="url(#pillGrad)" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#4ade80" class="font-sans" font-size="13" font-weight="700">⚡ Stockfish 19 NNUE</text>
        <text x="156" y="22" fill="#86efac" class="font-mono" font-size="10.5">3600+ Elo</text>
      </g>

      <!-- Pill 2: Maia ONNX -->
      <g transform="translate(225, 0)">
        <rect width="220" height="34" rx="8" fill="url(#pillGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#c084fc" class="font-sans" font-size="13" font-weight="700">🧠 Maia Chess Engine</text>
        <text x="160" y="22" fill="#e9d5ff" class="font-mono" font-size="10.5">ONNX Net</text>
      </g>

      <!-- Pill 3: Computer Vision -->
      <g transform="translate(455, 0)">
        <rect width="215" height="34" rx="8" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#38bdf8" class="font-sans" font-size="13" font-weight="700">👁️ Ultra CV Engine</text>
        <text x="144" y="22" fill="#bae6fd" class="font-mono" font-size="10.5">2,290 FPS</text>
      </g>

      <!-- Pill 4: WindMouse -->
      <g transform="translate(0, 44)">
        <rect width="215" height="34" rx="8" fill="url(#pillGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#fbbf24" class="font-sans" font-size="13" font-weight="700">🎯 WindMouse Kinematics</text>
        <text x="175" y="22" fill="#fde68a" class="font-mono" font-size="10">R≈0.95</text>
      </g>

      <!-- Pill 5: AR & Click-Through HUD -->
      <g transform="translate(225, 44)">
        <rect width="220" height="34" rx="8" fill="url(#pillGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#f472b6" class="font-sans" font-size="13" font-weight="700">🔮 Augmented Reality HUD</text>
        <text x="175" y="22" fill="#fbcfe8" class="font-mono" font-size="10.5">270 FPS</text>
      </g>

      <!-- Pill 6: Chrome MV3 Extension -->
      <g transform="translate(455, 44)">
        <rect width="215" height="34" rx="8" fill="url(#pillGrad)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#818cf8" class="font-sans" font-size="13" font-weight="700">🌐 Chrome Extension</text>
        <text x="156" y="22" fill="#c7d2fe" class="font-mono" font-size="10.5">MV3 Bridge</text>
      </g>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(0, 312)">
      <line x1="0" y1="0" x2="670" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
      <text x="0" y="22" fill="#64748b" class="font-mono" font-size="11">
        ✓ 110 Automated Tests (100% Pass)
      </text>
      <text x="235" y="22" fill="#64748b" class="font-mono" font-size="11">
        ✓ Zero Mouse Interception Lag (0.00ms)
      </text>
      <text x="495" y="22" fill="#64748b" class="font-mono" font-size="11">
        ✓ Cross-Platform Universal
      </text>
    </g>
  </g>
</svg>
