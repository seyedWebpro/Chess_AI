<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Chess AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 290px;
      background: #0f172a;
      color: #f8fafc;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      background: #10b98122;
      color: #10b981;
      border: 1px solid #10b98155;
    }
    .section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    select, button {
      width: 100%;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    select:focus, button:hover {
      border-color: #38bdf8;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155; transition: .3s; border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #38bdf8; }
    input:checked + .slider:before { transform: translateX(16px); }
    .footer {
      font-size: 10px;
      text-align: center;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">♟️ CHESS AI 2.0</div>
    <div id="ext-status" class="status-badge">آنلاین (۸۷۶۵)</div>
  </div>

  <div class="section">
    <div class="label">مغز و پرسونا هوش مصنوعی:</div>
    <select id="persona-select">
      <option value="god">God Mode (Stockfish 19 - Elo 3600)</option>
      <option value="1900">Maia 1900 (استاد باشگاه)</option>
      <option value="1500" selected>Maia 1500 (متوسط)</option>
      <option value="1100">Maia 1100 (مبتدی / آماتور)</option>
    </select>
  </div>

  <div class="section">
    <div class="label">حالت صدا و راهنما:</div>
    <select id="voice-select">
      <option value="EARCON" selected>سیگنال نامحسوس کلیک (Earcon)</option>
      <option value="WHISPER">زمزمه آهسته در هندزفری</option>
      <option value="VOICE">صدای کامل فارسی (Edge Neural)</option>
      <option value="MUTE">بی‌صدا</option>
    </select>
  </div>

  <div class="toggle-row">
    <span>نمایش فلش و هایلایت در صفحه</span>
    <label class="switch">
      <input type="checkbox" id="toggle-overlay" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>حرکت خودکار ماوس (WindMouse)</span>
    <label class="switch">
      <input type="checkbox" id="toggle-automouse">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    اتصال مستقیم محلی بدون تاخیر | پورت ۸۷۶۵
  </div>

  <script src="popup.js"></script>
</body>
</html>
